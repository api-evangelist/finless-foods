aid: finless-foods
name: Finless Foods
description: 'Finless Foods is an Emeryville, California cellular-agriculture company
  founded in 2017 by Michael Selden and Brian Wyrwas to grow real seafood from fish
  cells instead of harvesting it from the ocean. Its scientists established proprietary
  marine cell lines and a culture-media and bioreactor process that cultivates bluefin
  tuna and other high-value species into three-dimensional tissue with comparable taste,
  texture and nutrition to wild-caught fish, and the company has also shipped a plant-based
  tuna alternative into foodservice while the cell-cultivated line moves toward regulatory
  clearance and commercial launch. Backed by SOSV/IndieBio and a USD 34 million Series
  B closed in March 2022, and now led by co-founder and CEO Brandon Chen with co-founder
  Brian Wyrwas as CSO, Finless Foods is a food-biotechnology and consumer-products business
  rather than a software vendor: it operates a single-page Squarespace marketing site
  with a Squarespace Commerce cart, publishes no developer portal, no API documentation
  and no machine-readable API contract, and its 2017-era GitHub organization holds one
  dormant static-HTML repository.'
